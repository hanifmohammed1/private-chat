<!DOCTYPE html>
<html>
<head>
    <title>Private Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
        .message { margin: 10px 0; }
        .message.sent { text-align: right; }
        .message.received { text-align: left; }
        input { width: 80%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Private Chat</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            // Get database reference
            const database = firebase.database();
            const messagesRef = database.ref('messages');
            const messagesDiv = document.getElementById('messages');
            const messageInput = document.getElementById('messageInput');

            // Listen for new messages
            messagesRef.on('child_added', function(data) {
                const message = data.val();
                const messageDiv = document.createElement('div');
                messageDiv.className = message.sender === 'me' ? 'message sent' : 'message received';
                messageDiv.textContent = message.text;
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            function sendMessage() {
                const text = messageInput.value;
                if (text.trim()) {
                    messagesRef.push({
                        text: text,
                        sender: 'me',
                        timestamp: Date.now()
                    });
                    messageInput.value = '';
                }
            }

            // Add event listener for Enter key
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // Add click handler for send button
            document.getElementById('sendButton').onclick = sendMessage;
        });
    </script>
</body>
</html>
